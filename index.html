<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銷售管理</title>
    <style>
       body {
    /* 修正後的背景圖片指令 */
    background-image: url('./保健美肌.jpg'); 
    background-size: cover;          /* 讓圖片鋪滿整個螢幕 */
    background-position: center;     /* 圖片居中 */
    background-attachment: fixed;    /* 捲動時背景固定不跑掉 */
    background-repeat: no-repeat;    /* 圖片不重複 */
    
    font-family: "Microsoft JhengHei", sans-serif;
    margin: 0;
          
}
        .tab-content {
    display: none; /* 初始狀態隱藏 */
    background: rgba(255, 255, 255, 0.95); /* 稍微調高不透明度，確保閱讀清晰 */
    padding: 30px; 
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    margin-top: 50px; /* 讓表單往下移一點，不要擋住中間視覺 */
    animation: fadeIn 0.5s; /* 加入淡入動畫 */
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.active { 
    display: block;                       /* 被選中時顯示 */
}
        nav { background: #2c3e50; padding: 15px; text-align: center; color: white; }
        nav a { color: white; margin: 0 15px; text-decoration: none; cursor: pointer; font-weight: bold; }
        .container { padding: 20px; max-width: 900px; margin: auto; }
        .tab-content { display: none; background: white; padding: 30px; border-radius: 12px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .active { display: block; }
        input, select { display: block; width: 100%; margin: 10px 0; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; padding: 12px 25px; cursor: pointer; width: 100%; font-size: 16px; border-radius: 4px; }
        h2 { color: #2c3e50; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
    </style>
</head>
<body>

<nav>
    <div style="font-size: 20px; margin-bottom: 10px;">銷售管理</div>
    <div onclick="location.reload()" style="font-size: 10px; cursor: pointer; margin-bottom: 10px;">
        ✨回首頁
    </div>
    <!-- ...其餘選單... -->
    <a onclick="showTab('purchase')">進貨單</a>
    <a onclick="showTab('sales')">銷貨單</a>
    <a onclick="showTab('inventory')">庫存表</a>
    <a onclick="showTab('analysis')">分析表</a>
</nav>

<div class="container">
    <!-- 進貨單頁面 -->
    <div id="purchase" class="tab-content">
        <h2>📦 進貨單填寫</h2>
        <form id="purchaseForm">
            <label>資料日期</label><input type="date" name="date" required>
            <label>類別</label>
            <select name="category">
                <option value="保養品">保養品</option>
                <option value="保健食品">保健食品</option>
            </select>
            <select name="itemName" id="itemSelect" required>
    <option value="">-- 請選擇商品 --</option>
</select>
            <input type="number" name="quantity" placeholder="數量" required>
            <input type="number" name="price" placeholder="單價" required>
            <label>商品效期</label><input type="date" name="expiry" required>
            <button type="submit">確認送出</button>
        </form>
    </div>

    <!-- 銷貨單頁面 -->
    <div id="sales" class="tab-content">
    <h2>💰 銷貨單填寫</h2>
    <form id="salesForm">
        <label>日期</label><input type="date" name="date" required>
        <label>類別</label>
        <select name="category" required>
            <option value="">-- 請選擇類別 --</option>
            <option value="保養品">保養品</option>
            <option value="保健食品">保健食品</option>
        </select>
        <label>商品名稱</label>
        <select name="itemName" required><option value="">-- 請先選擇類別 --</option></select>
        
        <label>選擇出貨效期</label>
        <select name="expiry" required><option value="">-- 請先選擇商品 --</option></select>
        
        <label>數量</label><input type="number" name="quantity" required>
        <label>單價</label><input type="number" name="price" required>
        <button type="submit">確認銷售並扣除庫存</button>
    </form>
</div>

    <!-- 庫存與分析標籤先預留位置 -->
    <div id="inventory" class="tab-content">
    <h2>📊 庫存狀況</h2>
    <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; text-align: center;">
        <p>即時庫存已更新至後台</p>
        <button onclick="window.open('https://docs.google.com/spreadsheets/d/1ClDYOc1iyGYW9XbwQp4Z5XZYB3ecSC7_ab3O3WtLhI4/edit?gid=1250971671#gid=1250971671', '_blank')" style="background: #2980b9; width: auto; display: inline-block;">
            查看庫存與效期清單
        </button>
    </div>
</div>

<script>
    function showTab(id) {
    // 隱藏所有表單
    document.querySelectorAll('.tab-content').forEach(el => {
        el.classList.remove('active');
    });

    // 顯示被點選的那一個
    const target = document.getElementById(id);
    if (target) {
        target.classList.add('active');
        // 自動捲動到表單位置，方便手機操作
        target.scrollIntoView({ behavior: 'smooth' });
    }
}

    // 這裡請貼上您之前在 Google Apps Script 取得的 API 網址
    const API_URL = "https://script.google.com/macros/s/AKfycbwBVmsNYbsogT6pXLWoDDGDVjkYrulr3U_rMTPZBjvaBkZ0IIEtuJxCa99wzoxMpeVk/exec"; 

    document.getElementById('purchaseForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        sendData("進貨單", data);
    };

    document.getElementById('salesForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        data.totalPrice = data.quantity * data.price; // 自動計算總額
        sendData("銷貨單", data);
    };

    function sendData(target, data) {
        fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({ target, data })
        })
        .then(res => res.text())
        .then(msg => alert(msg))
        .catch(err => alert("失敗：" + err));
    }
  let productMasterData = {}; // 用來存放從 Excel 抓下來的全部分類資料

window.onload = function() {
    fetch(API_URL)
    .then(res => res.json())
    .then(data => {
        productMasterData = data; // 存入變數
        // 初始化：為網頁中所有的類別選單加入監聽功能
        setupDependentDropdowns();
    });
};

function setupTripleDropdowns() {
    const salesForm = document.getElementById('salesForm');
    const catSelect = salesForm.querySelector('select[name="category"]');
    const itemSelect = salesForm.querySelector('select[name="itemName"]');
    const expirySelect = salesForm.querySelector('select[name="expiry"]');

    // 第一層變動：類別 -> 商品
    catSelect.addEventListener('change', function() {
        const cat = this.value;
        const items = Object.keys(productMasterData[cat] || {});
        itemSelect.innerHTML = '<option value="">-- 請選擇商品 --</option>';
        expirySelect.innerHTML = '<option value="">-- 請先選擇商品 --</option>';
        items.forEach(item => {
            itemSelect.add(new Option(item, item));
        });
    });

    // 第二層變動：商品 -> 效期
    itemSelect.addEventListener('change', function() {
        const cat = catSelect.value;
        const item = this.value;
        const expiries = productMasterData[cat][item] || [];
        expirySelect.innerHTML = '<option value="">-- 請選擇效期 --</option>';
        expiries.forEach(exp => {
            expirySelect.add(new Option(exp, exp));
        });
    });
}
</script>

</body>
</html>
