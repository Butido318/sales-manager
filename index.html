<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銷售管理系統</title>
    <style>
        /* --- 基礎頁面樣式與背景設定 --- */
        body {
            /* 設定背景底圖，並確保圖片固定且不重複 */
            background-image: url('./保健美肌.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: "Microsoft JhengHei", sans-serif;
            margin: 0;
        }

        /* --- 內容容器：控制表單的最大寬度與置中 --- */
        .container { padding: 20px; max-width: 900px; margin: auto; }

        /* --- 表單區塊基礎樣式 --- */
        .tab-content {
            display: none; /* 初始狀態隱藏，點擊選單後才透過 .active 顯示 */
            background: rgba(255, 255, 255, 0.95); /* 半透明白色，增加質感與易讀性 */
            padding: 30px; 
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            margin-top: 50px;
            animation: fadeIn 0.5s; /* 呼叫下方的淡入動畫 */
        }

        /* --- 淡入動畫邏輯：從下方 20px 位置浮現 --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 強制顯示標籤：當 JavaScript 加上此類別時，內容會顯示出來 --- */
        .active { display: block !important; }

        /* --- 導覽列與按鈕樣式 --- */
        nav { background: #2c3e50; padding: 15px; text-align: center; color: white; }
        nav a { color: white; margin: 0 15px; text-decoration: none; cursor: pointer; font-weight: bold; }
        
        /* --- 輸入框與選單通用樣式 --- */
        input, select { display: block; width: 100%; margin: 10px 0; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        
        /* --- 按鈕樣式 --- */
        button { background: #27ae60; color: white; border: none; padding: 12px 25px; cursor: pointer; width: 100%; font-size: 16px; border-radius: 4px; margin-top: 10px; }
        button:hover { background: #2ecc71; } /* 滑鼠懸停時顏色加亮 */
        
        h2 { color: #2c3e50; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
    </style>
</head>
<body>

<!-- 導覽選單區塊 -->
<nav>
    <div style="font-size: 20px; margin-bottom: 10px;">銷售管理系統</div>
    <!-- 重新整理網頁會清空所有顯示的表單，回到首頁底圖狀態 -->
    
    <a onclick="showTab('purchase')">🛒進貨單</a>
    <a onclick="showTab('sales')">💰銷貨單</a>
    <a onclick="showTab('inventory')">📦庫存表</a>
    <a onclick="showTab('add-item')">🆕新增品項</a>
    <a onclick="showTab('analysis')">📊分析表</a>
    <a onclick="location.reload()">🛖首頁</a>
</nav>

<div class="container">
    <!-- 【進貨單】表單區塊 -->
    <div id="purchase" class="tab-content">
        <h2>📦 進貨單填寫</h2>
        <form id="purchaseForm">
            <label>資料日期</label><input type="date" id="pDate" name="date" required>
            <label>類別</label>
            <select name="category" required>
                <option value="">-- 請選擇類別 --</option>
                <option value="保養品">保養品</option>
                <option value="保健食品">保健食品</option>
                <option value="Others">Others</option>
            </select>
            <label>商品名稱</label>
            <select name="itemName" required><option value="">-- 請先選擇類別 --</option></select>
            <label>數量</label><input type="number" name="quantity" required>
            <label>單價</label><input type="number" name="price" required>
            <label>商品效期</label><input type="date" name="expiry" required>
            <button type="submit">確認送出</button>
        </form>
    </div>

    <!-- 【銷貨單】表單區塊 -->
    <div id="sales" class="tab-content">
        <h2>💰 銷貨單填寫</h2>
        <form id="salesForm">
            <label>日期</label><input type="date" id="sDate" name="date" required>
            <label>類別</label>
            <select name="category" required>
                <option value="">-- 請選擇類別 --</option>
                <option value="保養品">保養品</option>
                <option value="保健食品">保健食品</option>
                <option value="Others">Others</option>
            </select>
            <label>商品名稱</label>
            <select name="itemName" required><option value="">-- 請先選擇類別 --</option></select>
            
            <!-- 銷貨專用：根據目前庫存自動帶入可用效期 -->
            <label>選擇出貨效期</label>
            <select name="expiry" required><option value="">-- 請先選擇商品 --</option></select>
            
            <label>數量</label><input type="number" name="quantity" required>
            <label>單價</label><input type="number" name="price" required>
            <button type="submit">確認銷售並扣除庫存</button>
        </form>
    </div>

    <div id="add-item" class="tab-content">
    <h2>🆕新增品項</h2>
    <p style="color: #666; font-size: 14px;">將新商品加入「商品清單」中。</p>
    <form id="addItemForm">
        <label>類別</label>
        <select name="category" required>
            <option value="">-- 請選擇類別 --</option>
            <option value="保養品">保養品</option>
            <option value="保健食品">保健食品</option>
            <option value="Others">Others</option>
        </select>
        <label>新商品名稱</label>
        <input type="text" name="itemName" placeholder="請輸入完整商品名稱" required>
        <button type="submit" style="background: #e67e22;">確認新增</button>

        <button onclick="window.open('https://docs.google.com/spreadsheets/d/1ClDYOc1iyGYW9XbwQp4Z5XZYB3ecSC7_ab3O3WtLhI4/edit?usp=drivesdk', '_blank')" style="background: #2980b9; width: 100%; display: block; box-sizing: border-box;">
                查看商品清單
        </button>
    </form>
</div>

    <!-- 【庫存狀況】連結區塊 -->
    <div id="inventory" class="tab-content">
        <h2>📊 庫存狀況</h2>
        
        <div id="expiryWarning" style="background: #fff5f5; border-left: 5px solid #ff4d4d; padding: 15px; margin-bottom: 20px; border-radius: 8px;">
        <h3 style="color: #d63031; margin-top: 0;">⚠️ 即期品預警 (前 10 名)</h3>
        <ul id="warningList" style="list-style: none; padding: 0; margin: 0; font-size: 15px;">
            <li style="color: #666;">載入中...</li>
        </ul>
    </div>
        
        <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; text-align: center;">
            <p>即時庫存已更新至後台</p>
            <!-- 點擊後開啟你的 Google 試算表連結 -->
            <button onclick="window.open('https://docs.google.com/spreadsheets/d/1ClDYOc1iyGYW9XbwQp4Z5XZYB3ecSC7_ab3O3WtLhI4/edit#gid=1250971671', '_blank')" style="background: #2980b9; width: auto; display: inline-block;">
                開啟庫存表單
            </button>
        </div>
    </div>
</div>

<script>
    /* --- 邏輯 A：控制分頁切換顯示 --- */
    function showTab(id) {
        // 隱藏所有分頁內容
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        // 顯示被選中的分頁，並平滑滾動到該位置
        const target = document.getElementById(id);
        if (target) {
            target.classList.add('active');
            target.scrollIntoView({ behavior: 'smooth' });
        }
    }

    /* --- 邏輯 B：資料傳輸設定 --- */
    const API_URL = "https://script.google.com/macros/s/AKfycbwBVmsNYbsogT6pXLWoDDGDVjkYrulr3U_rMTPZBjvaBkZ0IIEtuJxCa99wzoxMpeVk/exec"; 

    // 進貨單送出監聽
    document.getElementById('purchaseForm').onsubmit = e => { 
        e.preventDefault(); 
        sendData("進貨單", Object.fromEntries(new FormData(e.target))); 
    };

    // 銷貨單送出監聽
    document.getElementById('salesForm').onsubmit = e => { 
        e.preventDefault(); 
        sendData("銷貨單", Object.fromEntries(new FormData(e.target))); 
    };

    // 新增品項表單的送出監聽
document.getElementById('addItemForm').onsubmit = e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    
    // 呼叫原本就有的 sendData 函式，目標設為 "商品清單"
    sendData("商品清單", data);
};

    // 通用傳送資料函式 (Fetch POST)
    function sendData(target, data) {
        fetch(API_URL, { method: "POST", body: JSON.stringify({ target, data }) })
        .then(res => res.text()).then(msg => { 
            alert(msg); 
            location.reload(); // 成功後刷新頁面，確保重新抓取最新庫存資料
        })
        .catch(err => alert("傳輸失敗，請檢查網路：" + err));
    }

    /* --- 邏輯 C：選單連動機制 --- */
    let productMasterData = {}; // 用於儲存從後台抓回來的分類商品效期結構

    // 網頁開啟時立刻抓取最新資料
    window.onload = function() {
    // --- 新增：設定預設日期為當天 ---
    const today = new Date();
    // 格式化日期為 YYYY-MM-DD (修正時區偏差)
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0'); // 月份從0開始，所以+1
    const dd = String(today.getDate()).padStart(2, '0');
    const todayStr = `${yyyy}-${mm}-${dd}`;

    // 將日期賦值給進貨單與銷貨單的日期欄位
    if(document.getElementById('pDate')) document.getElementById('pDate').value = todayStr;
    if(document.getElementById('sDate')) document.getElementById('sDate').value = todayStr;
        
        fetch(API_URL).then(res => res.json()).then(data => {
            productMasterData = data;
            initDropdowns(); // 初始化連動邏輯
            updateWarningList(); // <-- 新增這一行 效期警示用
        }).catch(err => console.error("資料載入失敗:", err));
    };

    function initDropdowns() {
        // 定義進貨單元件
        const pForm = document.getElementById('purchaseForm');
        const pCat = pForm.querySelector('select[name="category"]');
        const pItem = pForm.querySelector('select[name="itemName"]');

        // 進貨單連動：類別 > 商品
        pCat.addEventListener('change', function() {
            const items = Object.keys(productMasterData[this.value] || {});
            pItem.innerHTML = '<option value="">-- 請選擇商品 --</option>';
            items.forEach(item => pItem.add(new Option(item, item)));
        });

        // 定義銷貨單元件
        const sForm = document.getElementById('salesForm');
        const sCat = sForm.querySelector('select[name="category"]');
        const sItem = sForm.querySelector('select[name="itemName"]');
        const sExp = sForm.querySelector('select[name="expiry"]');

        // 銷貨單連動：類別 > 商品
        sCat.addEventListener('change', function() {
            const items = Object.keys(productMasterData[this.value] || {});
            sItem.innerHTML = '<option value="">-- 請選擇商品 --</option>';
            sExp.innerHTML = '<option value="">-- 請先選擇商品 --</option>';
            items.forEach(item => sItem.add(new Option(item, item)));
        });

        // 銷貨單連動：商品 > 效期 (三層連動核心)
sItem.addEventListener('change', function() {
    const cat = sCat.value;
    const item = this.value;

    // 增加一個 console.log 來檢查目前抓到的資料
    console.log("當前選擇類別:", cat, "選擇商品:", item);
    console.log("可用資料庫內容:", productMasterData);

    // 更加嚴謹的檢查：確保 cat 和 item 都有值且存在於資料中
    let expiries = [];
    if (cat && item && productMasterData[cat] && productMasterData[cat][item]) {
        expiries = productMasterData[cat][item];
    }
    
    sExp.innerHTML = '<option value="">-- 請選擇效期 --</option>';
    
    if (expiries.length > 0) {
        expiries.forEach(exp => {
            sExp.add(new Option(exp, exp));
        });
    } else {
        sExp.innerHTML = '<option value="">-- 無可用效期庫存 --</option>';
          } 
        });
 
</script>

</body>
</html>
